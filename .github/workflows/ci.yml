name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  local-dev-loop:
    runs-on: ubuntu-latest
    # Skip on PRs from forks: they have no access to the LocalStack token.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write .env
        run: |
          {
            echo "LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }}"
            echo "NANGO_ENCRYPTION_KEY=${{ secrets.NANGO_ENCRYPTION_KEY }}"
            echo "NANGO_HOSTPORT=http://localhost:3003"
            echo "NANGO_SECRET_KEY=nango-demo-secret-key"
            echo "DEBUG=0"
          } > .env
          # Fall back to a throwaway encryption key if the secret is unset.
          grep -q '^NANGO_ENCRYPTION_KEY=.\+' .env || \
            sed -i "s|^NANGO_ENCRYPTION_KEY=.*|NANGO_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env

      - name: Run the local dev loop (up, deploy, bootstrap, seed, test)
        run: make ci

      - name: Dump container logs on failure
        if: failure()
        run: make logs || true

      - name: Tear down
        if: always()
        run: make down
